---
name: Build dependencies

# Builds the prebuilt extension images referenced by the FROM lines in
# timescaledb/Dockerfile and pushes them to
# ghcr.io/<repository owner>/timescaledb/dependency/<component>:<version>.
#
# Each platform is built natively on its own runner (no QEMU), the resulting
# digests are then merged into one multi-platform manifest per component.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to build ('all' builds every component)"
        required: true
        default: "all"
        type: string
      platforms:
        description: "Comma separated list of platforms to build (amd64,arm64)"
        required: true
        default: "amd64,arm64"
        type: string

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/timescaledb/dependency

jobs:
  matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.set.outputs.build }}
      merge: ${{ steps.set.outputs.merge }}
    steps:
      - name: Compose matrix
        id: set
        env:
          COMPONENT: ${{ inputs.component }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Keep these versions in sync with the FROM lines in timescaledb/Dockerfile
          components='[
            {"component": "timescaledb-tools",                        "version": "latest"},
            {"component": "pgagent-pg17",                             "version": "pgagent-4.2.3"},
            {"component": "pgagent-pg18",                             "version": "pgagent-4.2.3"},
            {"component": "timescaledb-toolkit-pg17",                 "version": "1.26.0"},
            {"component": "timescaledb-toolkit-pg18",                 "version": "1.26.0"},
            {"component": "postgis-pg17",                             "version": "3.6.4"},
            {"component": "postgis-pg18",                             "version": "3.6.4"},
            {"component": "postgresql-extension-system-stat-pg17",    "version": "4.1"},
            {"component": "postgresql-extension-system-stat-pg18",    "version": "4.1"},
            {"component": "pgvector-pg17",                            "version": "0.8.6"},
            {"component": "pgvector-pg18",                            "version": "0.8.6"}
          ]'
          runners='{"amd64": "ubuntu-latest", "arm64": "ubuntu-24.04-arm"}'

          merge=$(echo "${components}" | jq -c --arg c "${COMPONENT}" \
            '[ .[] | select($c == "all" or .component == $c) ]')
          build=$(echo "${merge}" | jq -c --argjson r "${runners}" --arg p "${PLATFORMS}" \
            '[ .[] as $c | ($p | split(",") | map(gsub(" "; "")) | .[]) as $platform
               | $c + {platform: $platform, runner: $r[$platform]} ]')

          echo "build={\"include\": ${build}}" >> "${GITHUB_OUTPUT}"
          echo "merge={\"include\": ${merge}}" >> "${GITHUB_OUTPUT}"
          echo "${build}" | jq .

  build:
    name: Build ${{ matrix.component }} (${{ matrix.platform }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: timescaledb/docker-dependencies/${{ matrix.component }}
          platforms: linux/${{ matrix.platform }}
          build-args: |
            VERSION=${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.component }}:${{ matrix.version }}
    needs:
      - matrix
      - build
    # Publish the components that did build, even if another component failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.merge) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${{ matrix.component }}:${{ matrix.version }}" \
            $(printf "${REGISTRY}/${{ matrix.component }}@sha256:%s " *)
          docker buildx imagetools inspect "${REGISTRY}/${{ matrix.component }}:${{ matrix.version }}"
